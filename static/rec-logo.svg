<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210" fill="none">
  <!-- Outer cube silhouette -->
  <path d="M100 14 L176 54 V146 L100 186 L24 146 V54 Z" stroke="#163A32" stroke-width="2.25" stroke-linejoin="round"/>
  <!-- Top-face Y: center → top / right / left -->
  <path d="M100 100 L100 14 M100 100 L176 54 M100 100 L24 54" stroke="#163A32" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Four nodes: top, center, left, right -->
  <circle cx="100" cy="14" r="2.4" fill="#163A32"/>
  <circle cx="100" cy="100" r="2.4" fill="#163A32"/>
  <circle cx="24" cy="54" r="2.4" fill="#163A32"/>
  <circle cx="176" cy="54" r="2.4" fill="#163A32"/>
  <!-- REC on right face -->
  <g transform="matrix(0.86 -0.5 0 0.92 138 128)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#163A32" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">REC</text>
  </g>
</svg>
